<div id="consent-banner" role="region" aria-label="Cookie consent" hidden>
  <p>This site uses <a href="https://posthog.com/privacy" target="_blank" rel="noopener">PostHog</a> analytics (EU servers). With your consent, a cookie recognises repeat visits. Without it, only anonymous page views are counted, with no cookies.</p>
  <div class="consent-buttons">
    <button type="button" id="consent-decline">Decline</button>
    <button type="button" id="consent-accept">Accept</button>
  </div>
</div>
<style>
  #consent-banner { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; gap: 16px; background: #f8f8f8; color: #333; border-top: 1px solid #ddd; box-shadow: 0 -1px 6px rgba(0,0,0,.08); padding: 8px 16px; font-size: 13px; }
  #consent-banner[hidden] { display: none; }
  #consent-banner p { margin: 0; }
  #consent-banner .consent-buttons { flex-shrink: 0; white-space: nowrap; }
  #consent-banner button { margin-left: 8px; padding: 3px 12px; border: 1px solid #888; border-radius: 4px; background: #fff; cursor: pointer; }
  #consent-banner #consent-accept { background: #333; color: #fff; border-color: #333; }
  @media (max-width: 600px) {
    #consent-banner { flex-direction: column; align-items: stretch; gap: 8px; }
    #consent-banner .consent-buttons { text-align: right; }
  }
</style>
<script>
  (function () {
    var banner = document.getElementById('consent-banner');
    function store(v) { try { localStorage.setItem('analytics_consent', v); } catch (e) {} }
    function read() { try { return localStorage.getItem('analytics_consent'); } catch (e) { return null; } }
    // Reserve space below the page while the bar is visible, so it never covers content.
    function pad() { document.body.style.paddingBottom = banner.hidden ? '' : banner.offsetHeight + 'px'; }
    function show() { banner.hidden = false; pad(); }
    function hide() { banner.hidden = true; pad(); }
    window.addEventListener('resize', pad);
    if (!read()) show();
    document.getElementById('consent-accept').onclick = function () {
      store('granted');
      if (window.posthog && posthog.set_config) posthog.set_config({ persistence: 'localStorage+cookie' });
      hide();
    };
    document.getElementById('consent-decline').onclick = function () {
      store('denied');
      if (window.posthog && posthog.opt_out_capturing) posthog.opt_out_capturing();
      if (window.clearPosthogStorage) window.clearPosthogStorage();
      hide();
    };
    var reopen = document.getElementById('consent-reopen');
    if (reopen) reopen.onclick = function (e) { e.preventDefault(); show(); };
  })();
</script>
