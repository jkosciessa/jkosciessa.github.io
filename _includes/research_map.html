<figure id="research-map" class="research-map">
  <div class="rm-body">
  <div class="rm-left">
  <div class="rm-stage">
    <svg viewBox="0 0 960 380" role="img" aria-label="Map of study and research locations: Berlin, Singapore, London and Nijmegen, connected in chronological order. The list beside the map gives the same information."></svg>
    <div class="rm-tip" role="tooltip" hidden></div>
  </div>
  <div class="rm-controls">
    <button type="button" class="rm-replay">Replay</button>
  </div>
  </div>
  <ol class="rm-steps">
    <li data-place="berlin"><span class="rm-years">2011–2014</span> <span class="rm-city">Berlin</span> · <span class="rm-what">B.Sc. Psychology, FU Berlin</span></li>
    <li data-place="singapore"><span class="rm-years">2013–2014</span> <span class="rm-city">Singapore</span> · <span class="rm-what">Exchange, NUS and Duke-NUS</span></li>
    <li data-place="berlin"><span class="rm-years">2014–2016</span> <span class="rm-city">Berlin</span> · <span class="rm-what">M.Sc. Mind &amp; Brain, HU Berlin</span></li>
    <li data-place="london"><span class="rm-years">2015–2016</span> <span class="rm-city">London</span> · <span class="rm-what">Erasmus exchange, UCL</span></li>
    <li data-place="berlin"><span class="rm-years">2016–2022</span> <span class="rm-city">Berlin</span> · <span class="rm-what">PhD and postdoc, MPI for Human Development</span></li>
    <li data-place="nijmegen"><span class="rm-years">2022–</span> <span class="rm-city">Nijmegen</span> · <span class="rm-what">Donders Institute, Radboud University</span></li>
  </ol>
  </div>
</figure>

<script src="{{ site.baseurl }}/js/vendor/d3-array.min.js" defer></script>
<script src="{{ site.baseurl }}/js/vendor/d3-geo.min.js" defer></script>
<script src="{{ site.baseurl }}/js/vendor/topojson-client.min.js" defer></script>
<script>
window.addEventListener('load', function () {
  var root = document.getElementById('research-map');
  if (!root) return;
  var det = root.closest('details');
  var started = false;

  function start() {
    if (started || !window.d3 || !d3.geoPath || !window.topojson) return;
    started = true;

    var NS = 'http://www.w3.org/2000/svg';
    var W = 960, H = 380;
    // label offsets in screen pixels, so they stay constant while zooming
    var places = {
      berlin:    { name: 'Berlin',    coord: [13.40, 52.52], dx: 9,  dy: -6, anchor: 'start' },
      london:    { name: 'London',    coord: [-0.13, 51.51], dx: -9, dy: 4,  anchor: 'end' },
      nijmegen:  { name: 'Nijmegen',  coord: [5.86, 51.84],  dx: 0,  dy: -10, anchor: 'middle' },
      singapore: { name: 'Singapore', coord: [103.82, 1.35], dx: 9,  dy: 4,  anchor: 'start' }
    };
    var items = [].slice.call(root.querySelectorAll('.rm-steps li'));
    var stops = items.map(function (li) { return li.getAttribute('data-place'); });
    var svg = root.querySelector('svg');
    var tip = root.querySelector('.rm-tip');
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    var proj = d3.geoNaturalEarth1().fitExtent([[0, 0], [W, H]],
      { type: 'MultiPoint', coordinates: [[-12, 60], [112, 60], [-12, -6], [112, -6]] });
    var path = d3.geoPath(proj);
    var P = {};
    Object.keys(places).forEach(function (k) { P[k] = proj(places[k].coord); });

    // a view is a viewBox [x, y, w, h] that frames the given places at the map's aspect ratio
    function frame(keys, padFactor, minW) {
      var xs = keys.map(function (k) { return P[k][0]; }), ys = keys.map(function (k) { return P[k][1]; });
      var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
      var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
      var w = Math.max((x1 - x0) * padFactor, (y1 - y0) * padFactor * W / H, minW);
      var h = w * H / W;
      return [(x0 + x1) / 2 - w / 2, (y0 + y1) / 2 - h / 2, w, h];
    }
    var EUROPE = frame(['london', 'nijmegen', 'berlin'], 2.2, 150);
    var WIDE = frame(['london', 'nijmegen', 'berlin', 'singapore'], 1.3, 0);
    function viewFor(i) {
      return (stops[i] === 'singapore' || (i > 0 && stops[i - 1] === 'singapore')) ? WIDE : EUROPE;
    }

    var vb = EUROPE.slice();
    var land, arcs = [], markers = {}, active = null;

    function el(name, attrs, parent) {
      var e = document.createElementNS(NS, name);
      for (var k in attrs) e.setAttribute(k, attrs[k]);
      (parent || svg).appendChild(e);
      return e;
    }
    function pxPerUnit() { return (svg.getBoundingClientRect().width || W) / vb[2]; }

    // apply the current view and keep marks at a constant on-screen size
    function apply() {
      svg.setAttribute('viewBox', vb.join(' '));
      var u = 1 / pxPerUnit();
      arcs.forEach(function (p) { p.style.strokeWidth = 2 * u; });
      Object.keys(markers).forEach(function (k) {
        var m = markers[k], on = k === active;
        m.dot.setAttribute('r', (on ? 7 : 5) * u);
        m.dot.style.strokeWidth = 1.5 * u;
        m.hit.setAttribute('r', 12 * u);
        m.text.setAttribute('x', P[k][0] + places[k].dx * u);
        m.text.setAttribute('y', P[k][1] + places[k].dy * u);
        m.text.style.fontSize = 12 * u + 'px';
        m.text.style.strokeWidth = 3 * u;
      });
    }

    function zoomTo(target, dur, done) {
      var from = vb.slice(), t0 = Date.now();
      if (reduced || dur === 0) { vb = target.slice(); apply(); if (done) done(); return; }
      function step() {
        var t = Math.min(1, (Date.now() - t0) / dur), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        vb = from.map(function (v, j) { return v + (target[j] - v) * e; });
        apply();
        if (t < 1) setTimeout(step, 16); else if (done) done();
      }
      step();
    }

    fetch('{{ site.baseurl }}/assets/data/land-50m.json').then(function (r) { return r.json(); }).then(function (world) {
      land = el('path', { 'class': 'rm-land', d: path(topojson.feature(world, world.objects.land)) });

      // arcs between consecutive stops; outbound and return trips bend to opposite sides
      for (var i = 1; i < stops.length; i++) {
        var a = P[stops[i - 1]], b = P[stops[i]];
        var mx = (a[0] + b[0]) / 2, my = (a[1] + b[1]) / 2;
        var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.sqrt(dx * dx + dy * dy);
        var bend = len * 0.25 * (dx >= 0 ? -1 : 1);
        var cx = mx - dy / len * bend, cy = my + dx / len * bend;
        var p = el('path', { 'class': 'rm-arc', d: 'M' + a[0] + ',' + a[1] + 'Q' + cx + ',' + cy + ' ' + b[0] + ',' + b[1] });
        var L = p.getTotalLength();
        p.style.strokeDasharray = L;
        p.style.strokeDashoffset = L;
        arcs.push(p);
      }

      // markers with direct labels; hover/focus lists every stay at that place
      Object.keys(places).forEach(function (key) {
        var pl = places[key];
        var g = el('g', { 'class': 'rm-marker', tabindex: 0, role: 'button', 'aria-label': pl.name });
        var hit = el('circle', { 'class': 'rm-hit', cx: P[key][0], cy: P[key][1] }, g);
        var dot = el('circle', { 'class': 'rm-dot', cx: P[key][0], cy: P[key][1] }, g);
        var text = el('text', { 'text-anchor': pl.anchor }, g);
        text.textContent = pl.name;
        function show() {
          var html = '<strong>' + pl.name + '</strong>';
          items.forEach(function (li) {
            if (li.getAttribute('data-place') === key) {
              html += '<div>' + li.querySelector('.rm-years').textContent + ': ' + li.querySelector('.rm-what').textContent + '</div>';
            }
          });
          tip.innerHTML = html;
          tip.hidden = false;
          var s = pxPerUnit(), wpx = svg.getBoundingClientRect().width;
          var left = (P[key][0] - vb[0]) * s + 12, top = (P[key][1] - vb[1]) * s + 12;
          tip.style.left = Math.max(0, Math.min(left, wpx - 220)) + 'px';
          tip.style.top = top + 'px';
        }
        function hide() { tip.hidden = true; }
        g.addEventListener('mouseenter', show); g.addEventListener('focus', show);
        g.addEventListener('mouseleave', hide); g.addEventListener('blur', hide);
        markers[key] = { g: g, dot: dot, hit: hit, text: text };
      });

      var token = 0, timer = null, view = EUROPE;
      function setActive(i) {
        active = stops[i];
        items.forEach(function (li, j) { li.classList.toggle('active', j === i); li.classList.toggle('done', j < i); });
        Object.keys(markers).forEach(function (k) { markers[k].g.classList.toggle('active', k === active); });
        apply();
      }
      // timer-driven arc drawing (independent of CSS transitions)
      function drawArc(p, L, tok) {
        var t0 = Date.now();
        (function f() {
          if (tok !== token) return;
          var t = Math.min(1, (Date.now() - t0) / 900), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
          p.style.strokeDashoffset = L * (1 - e);
          if (t < 1) setTimeout(f, 16);
        })();
      }
      function showUpTo(i, animate) {
        arcs.forEach(function (p, j) {
          var L = p.getTotalLength();
          if (animate && !reduced && j === i - 1) drawArc(p, L, token);
          else p.style.strokeDashoffset = j < i ? 0 : L;
        });
        setActive(i);
      }
      function stepTo(i, tok) {
        if (tok !== token) return;
        var go = function () {
          if (tok !== token) return;
          showUpTo(i, true);
          if (i + 1 < stops.length) timer = setTimeout(function () { stepTo(i + 1, tok); }, 1500);
        };
        var v = viewFor(i);
        if (v !== view) { view = v; zoomTo(v, 800, go); } else go();
      }
      function play() {
        token++; clearTimeout(timer);
        if (reduced) { view = EUROPE; zoomTo(EUROPE, 0); showUpTo(stops.length - 1, false); return; }
        view = EUROPE; zoomTo(EUROPE, 0); showUpTo(0, false);
        var tok = token;
        timer = setTimeout(function () { stepTo(1, tok); }, 1200);
      }
      items.forEach(function (li, i) {
        li.tabIndex = 0;
        li.addEventListener('click', function () {
          token++; clearTimeout(timer);
          showUpTo(i, false);
          view = viewFor(i); zoomTo(view, reduced ? 0 : 600);
        });
        li.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); li.click(); } });
      });
      root.querySelector('.rm-replay').addEventListener('click', play);
      window.addEventListener('resize', apply);
      play();
    }).catch(function () { root.querySelector('.rm-stage').hidden = true; });
  }

  // the map sits in a collapsed dropdown: load, draw and animate on first opening
  if (!det || det.open) start();
  else det.addEventListener('toggle', function () { if (det.open) start(); });
});
</script>
